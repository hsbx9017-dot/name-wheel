<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>姓名大转盘 · 幸运点名</title><style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#263c35;background:#f5f5eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 15%,#e2eddf,transparent 55%);min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}header{max-width:1260px;margin:auto;padding:28px 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d7ded1}.brand{font-weight:bold;letter-spacing:2px}.brand span{color:#e28b44;margin-right:10px}.tag{font-size:12px;border:1px solid #cad4c6;border-radius:30px;padding:8px 15px;color:#617266}main{max-width:1200px;padding:35px 32px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:4px;color:#7c8c74}h1{font-size:38px;margin:10px 0;font-weight:800;letter-spacing:3px}.intro p{color:#7b8779;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:26px}.stage{position:relative;text-align:center;background:#edf0e4;border:1px solid #dbe1d1;border-radius:28px;padding:25px 20px 20px;overflow:hidden}.stage:before{content:"LUCKY YOU";position:absolute;font-size:90px;letter-spacing:8px;font-weight:bold;color:#e1e7d6;left:0;right:0;top:35%}.wheel-wrap{position:relative;max-width:490px;margin:8px auto 20px;filter:drop-shadow(0 18px 18px #3f523524)}canvas{display:block;width:100%;position:relative;border:10px solid #fffdf3;border-radius:50%;background:#e1e8d8;box-shadow:0 0 0 1px #cdd4bf}.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:28px;height:43px;background:#263e34;clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%);z-index:3}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:7px solid #fffbed;background:#2c483c;color:#fff7df;border-radius:50%;width:91px;height:91px;display:grid;place-content:center;font-size:22px;box-shadow:0 4px 12px #19362940;letter-spacing:3px}.spin{position:relative;background:#2c483c;color:#fff8df;border:0;border-radius:14px;padding:16px 35px;min-width:240px;font-weight:bold;font-size:18px;box-shadow:0 6px 0 #1c3227}.spin:hover{background:#385b4b}.hint{position:relative;font-size:12px;color:#7c8875;margin:17px 0 0}.card{background:#fffef8;border:1px solid #e2e4d7;border-radius:22px;padding:23px;margin-bottom:18px}.card h2{font-size:16px;margin:0 0 18px;display:flex;align-items:center;justify-content:space-between}.count{font-size:12px;font-weight:normal;color:#7b8976}.mode{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:16px}.mode input{width:18px;height:18px;accent-color:#2c483c}.names{display:flex;flex-wrap:wrap;gap:7px}.chip{font-size:12px;background:#edf1e6;padding:7px 11px;border-radius:7px}.chip.drawn{opacity:.4;text-decoration:line-through}.ghost{background:none;border:1px solid #d4ddcd;color:#4a614c;border-radius:9px;padding:9px 14px;font-size:12px}.ghost:hover{background:#edf1e6}.resultbox{background:#e9eddd;border:0;min-height:143px;position:relative;overflow:hidden}.result-label{font-size:12px;color:#74816b;letter-spacing:2px}.winner{font-size:36px;font-weight:800;letter-spacing:4px;margin:12px 0;color:#304d3b}.history{display:flex;gap:8px;flex-wrap:wrap;max-height:115px;overflow:auto}.empty{font-size:13px;color:#8a9380}.history span{font-size:12px;border-bottom:1px solid #e1e6d8;padding:6px}.footer{text-align:center;color:#8b9582;font-size:11px;margin:25px 0;line-height:1.9}.footer a{color:inherit}dialog{border:1px solid #d7ddcd;border-radius:22px;padding:28px;width:min(92vw,440px);background:#fffdf4;color:#2c483c}dialog::backdrop{background:#15251e80;backdrop-filter:blur(5px)}dialog h2{margin-top:0}textarea{width:100%;height:300px;border:1px solid #cdd7c6;border-radius:10px;padding:12px;resize:vertical;line-height:1.8;background:#f9faf2}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}.primary{background:#2c483c;color:white;border:0;border-radius:9px;padding:10px 18px}.error{color:#ad4734;font-size:12px}.confetti{position:fixed;width:9px;height:13px;top:-20px;pointer-events:none;z-index:20;animation:fall 2.5s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:800px){header{padding:20px}.tag{font-size:10px}main{padding:24px 16px}.intro{display:block}h1{font-size:30px}.layout{grid-template-columns:1fr}.stage{padding:22px 15px}.wheel-wrap{max-width:430px}.card{padding:20px}.intro p{margin-bottom:20px}}
</style></head><body><header><div class="brand"><span>✳</span>姓名大转盘</div><div class="tag">每一次转动，都有惊喜</div></header><main><div class="intro"><div><div class="eyebrow">LET LUCK MAKE THE CALL</div><h1>今天，轮到谁？</h1></div><p>把选择交给转盘，让期待转起来。</p></div><div class="layout"><section class="stage" aria-label="姓名转盘"><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="1000" height="1000" aria-label="参与者姓名大转盘"></canvas><div class="hub" aria-hidden="true">好运</div></div><button class="spin" id="spin">转动大转盘 ↗</button><p class="hint">点击开始 · 按空格键也可以抽取</p></section><aside><section class="card resultbox"><div class="result-label">本次幸运姓名</div><div class="winner" id="winner" role="status" aria-live="polite">虚位以待</div><div class="count" id="status">准备好，下一位幸运儿就是……</div></section><section class="card"><h2>参与名单 <span class="count" id="count"></span></h2><label class="mode"><input type="checkbox" id="unique" checked>不重复抽取<span class="count">抽过的姓名暂时移出</span></label><div class="names" id="names"></div><div style="display:flex;gap:8px;margin-top:18px"><button class="ghost" id="edit">编辑名单</button><button class="ghost" id="reset">重新开始</button><button class="ghost" id="full">全屏</button></div></section><section class="card"><h2>抽取记录 <span class="count" id="round">0 次</span></h2><div class="history" id="history"><div class="empty">每一次幸运，都记在这里。</div></div></section></aside></div><div class="footer">等概率随机抽取 · 名单与记录仅保存在当前浏览器<br>参考开源项目 <a href="https://github.com/byoules/random-spinning-wheel" target="_blank" rel="noopener">Random Spinning Wheel</a> · MIT License</div></main><dialog id="editor"><h2>编辑参与名单</h2><p class="count">每行一个姓名，最多 100 人。保存后开始新一轮。</p><textarea id="input" aria-label="每行一个姓名" spellcheck="false"></textarea><div class="error" id="error"></div><div class="actions"><button class="ghost" id="defaults">恢复原始25人</button><button class="ghost" id="cancel">取消</button><button class="primary" id="save">保存名单</button></div></dialog><script src="app.js"></script></body></html>
